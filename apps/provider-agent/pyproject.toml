[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-compute-provider-agent"
version = "0.1.0"
description = "Lightweight hardware discovery and compute execution agent"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Distributed Compute Network" }
]
dependencies = [
    "requests>=2.31.0",
    "psutil>=5.9.8",
]

[project.scripts]
provider-agent = "agent.cli:main"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
