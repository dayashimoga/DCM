apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-network-policy
  namespace: distributed-compute
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api-control-plane
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming traffic from Ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 4000
    # Allow Prometheus monitoring scrape
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 4000
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow PostgreSQL and Redis access
    - ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
    # Allow HTTPS external outbound for Stripe / Webhooks / Blockchain
    - ports:
        - protocol: TCP
          port: 443
