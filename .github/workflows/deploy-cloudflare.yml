name: Deploy to Cloudflare Free Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build Next.js Static Export & Deploy to Cloudflare Pages
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Shared Types
        run: npm run build --workspace=@distributed-compute/shared-types

      - name: Build Web App Static Export
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.distributed.gpu/api/v1' }}
          NEXT_PUBLIC_WS_URL: ${{ secrets.NEXT_PUBLIC_WS_URL || 'wss://api.distributed.gpu' }}
        run: |
          cd apps/web
          npm run build

      - name: Verify Static Export Artifacts
        run: |
          test -d apps/web/out
          test -f apps/web/out/index.html
          echo "Static export artifacts successfully generated in apps/web/out"

      - name: Ensure Cloudflare Pages Project Exists
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages project create distributed-compute --production-branch=main || echo "Cloudflare Pages project distributed-compute exists or ready"

      - name: Deploy to Cloudflare Pages (When Secrets Configured)
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/out --project-name=distributed-compute --branch=main --commit-dirty=true

      - name: Deployment Notice (When Cloudflare Secrets Pending)
        if: env.CF_API_TOKEN == '' || env.CF_ACCOUNT_ID == ''
        run: |
          echo "================================================================================="
          echo " NOTICE: Next.js static export build succeeded (18/18 routes ready in apps/web/out)."
          echo " To enable automated live deployment to Cloudflare Pages:"
          echo " 1. Go to your GitHub Repository -> Settings -> Secrets and variables -> Actions"
          echo " 2. Add 'CLOUDFLARE_API_TOKEN' (Cloudflare API token with Cloudflare Pages permissions)"
          echo " 3. Add 'CLOUDFLARE_ACCOUNT_ID' (Your Cloudflare Account ID)"
          echo "================================================================================="
